<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; max-width: 950px; margin: auto; }
      .filter-area { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
      .filter-area input, .filter-area select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
      .filter-area input { flex: 1; min-width: 200px; }
      
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
      th { background-color: #4CAF50; color: white; }
      tr:nth-child(even) { background-color: #f2f2f2; }
      tr:hover { background-color: #e9e9e9; }
      
      a.btn-aksi { text-decoration: none; font-weight: bold; margin-right: 10px; display: inline-block; }
      .link-download { color: #4CAF50; }
      .link-hapus { color: #f44336; cursor: pointer; }
      
      .btn-kembali { padding: 10px 15px; background-color: #2196F3; color: white; border: none; cursor: pointer; border-radius: 4px; margin-bottom: 20px;}
      
      .pagination-area { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
      .pagination-area button { padding: 8px 15px; background-color: #2196F3; color: white; border: none; cursor: pointer; border-radius: 4px; }
      .pagination-area button:disabled { background-color: #cccccc; cursor: not-allowed; }
      .pagination-info { font-weight: bold; color: #555; }
    </style>
  </head>
  <body>

    <h2>📂 Dashboard Dokumen Terupload</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
      <button class="btn-kembali" style="margin-bottom: 0;" onclick="window.top.location.href='<?= getScriptUrl() ?>?page=Index'">⬅️ Kembali ke Form Upload</button>
      
      <!-- TOMBOL BARU UNTUK FOLDER DRIVE -->
      <a href="https://drive.google.com/drive/folders/1jVndFPbyB5-Af0EJEYAEbEv3hRuJVhAp?usp=sharing" target="_blank" style="text-decoration: none;">
        <button class="btn-kembali" style="margin-bottom: 0; background-color: #FF9800;">📁 Buka Folder Drive</button>
      </a>
    </div>

    <div class="filter-area">
      <input type="text" id="inputCari" onkeyup="resetDanFilter()" placeholder="🔍 Cari nama file atau folder...">
      <select id="filterKlaster" onchange="resetDanFilter()">
        <option value="">-- Semua Klaster --</option>
      </select>
    </div>

    <table id="tabelFile">
      <thead>
        <tr>
          <th>Waktu Upload</th>
          <th>Nama File</th>
          <th>Lokasi Folder</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tbodyFile">
        <tr><td colspan="4" style="text-align:center;">⏳ Memuat data...</td></tr>
      </tbody>
    </table>

    <div class="pagination-area" id="paginationArea" style="display: none;">
      <button id="btnPrev" onclick="halamanSebelumnya()">⬅️ Sebelumnya</button>
      <span class="pagination-info" id="infoHalaman">Halaman 1 dari 1</span>
      <button id="btnNext" onclick="halamanBerikutnya()">Selanjutnya ➡️</button>
    </div>

    <script>
      let semuaDataFile = [];     
      let dataTersaring = [];     
      let halamanSaatIni = 1;
      const barisPerHalaman = 10; 

      window.onload = function() {
        muatData();
      };

      function muatData() {
        document.getElementById('tbodyFile').innerHTML = '<tr><td colspan="4" style="text-align:center;">⏳ Memuat data...</td></tr>';
        google.script.run
          .withSuccessHandler(initDashboard)
          .withFailureHandler(function(error) {
             document.getElementById('tbodyFile').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">❌ Gagal memuat data: ' + error + '</td></tr>';
          })
          .getDaftarFileSukses();
      }

      function initDashboard(data) {
        if (!data || !Array.isArray(data)) {
          document.getElementById('tbodyFile').innerHTML = '<tr><td colspan="4" style="text-align:center; color:orange;">⚠️ Format data tidak valid.</td></tr>';
          return;
        }

        semuaDataFile = data; 
        dataTersaring = data; 
        
        // Reset dropdown filter klaster (agar tidak dobel saat data dimuat ulang)
        var selectKlaster = document.getElementById('filterKlaster');
        selectKlaster.innerHTML = '<option value="">-- Semua Klaster --</option>';
        var daftarKlaster = [];
        
        data.forEach(function(item) {
          var klaster = item.folder.split('/')[0]; 
          if (daftarKlaster.indexOf(klaster) === -1) {
            daftarKlaster.push(klaster);
            var opt = document.createElement('option');
            opt.value = klaster;
            opt.text = klaster;
            selectKlaster.appendChild(opt);
          }
        });

        renderHalaman();
      }

      function resetDanFilter() {
        var kataKunci = document.getElementById('inputCari').value.toLowerCase();
        var klasterDipilih = document.getElementById('filterKlaster').value;

        dataTersaring = semuaDataFile.filter(function(item) {
          var cocokKataKunci = item.namaFile.toLowerCase().includes(kataKunci) || 
                               item.folder.toLowerCase().includes(kataKunci);
          
          var cocokKlaster = true;
          if (klasterDipilih !== "") {
            cocokKlaster = item.folder.indexOf(klasterDipilih) === 0;
          }
          return cocokKataKunci && cocokKlaster;
        });

        halamanSaatIni = 1; 
        renderHalaman();
      }

      function renderHalaman() {
        var tbody = document.getElementById('tbodyFile');
        tbody.innerHTML = ""; 

        if (dataTersaring.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">🔍 Data tidak ditemukan.</td></tr>';
          document.getElementById('paginationArea').style.display = 'none';
          return;
        }

        document.getElementById('paginationArea').style.display = 'flex';

        var indexAwal = (halamanSaatIni - 1) * barisPerHalaman;
        var indexAkhir = indexAwal + barisPerHalaman;
        var dataHalamanIni = dataTersaring.slice(indexAwal, indexAkhir);

        dataHalamanIni.forEach(function(item) {
          var tr = document.createElement('tr');
          
          // Format tanggal (Hanya Tanggal, tanpa Jam)
          var tanggal = "Waktu tidak diketahui";
          if (item.waktu) {
            var d = new Date(item.waktu);
            if (!isNaN(d.getTime())) {
              tanggal = d.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            } else {
              tanggal = item.waktu; 
            }
          }
          
          // Gunakan fungsi escape agar nama file aman dari tanda kutip
          var namaFileAman = item.namaFile.replace(/'/g, "\\'");
          var folderAman = item.folder.replace(/'/g, "\\'");

          tr.innerHTML = `
            <td>${tanggal}</td>
            <td>${item.namaFile}</td>
            <td>${item.folder}</td>
            <td>
              <a href="${item.url || '#'}" target="_blank" class="btn-aksi link-download">📄 Buka</a>
              <a onclick="konfirmasiHapus('${namaFileAman}', '${folderAman}')" class="btn-aksi link-hapus">🗑️ Hapus</a>
            </td>
          `;
          tbody.appendChild(tr);
        });

        updateKontrolPagination();
      }

      function updateKontrolPagination() {
        var totalHalaman = Math.ceil(dataTersaring.length / barisPerHalaman);
        document.getElementById('infoHalaman').innerText = `Halaman ${halamanSaatIni} dari ${totalHalaman}`;
        document.getElementById('btnPrev').disabled = (halamanSaatIni === 1);
        document.getElementById('btnNext').disabled = (halamanSaatIni === totalHalaman);
      }

      function halamanSebelumnya() {
        if (halamanSaatIni > 1) { halamanSaatIni--; renderHalaman(); }
      }

      function halamanBerikutnya() {
        var totalHalaman = Math.ceil(dataTersaring.length / barisPerHalaman);
        if (halamanSaatIni < totalHalaman) { halamanSaatIni++; renderHalaman(); }
      }

      // --- FUNGSI HAPUS FILE ---
      function konfirmasiHapus(namaFile, folder) {
        var yakin = confirm("Apakah Anda yakin ingin menghapus file:\n" + namaFile + "\n\nFile akan dipindahkan ke Trash Google Drive.");
        if (yakin) {
          // Sembunyikan sementara tabel dan tampilkan pesan loading
          document.getElementById('tbodyFile').innerHTML = '<tr><td colspan="4" style="text-align:center; color:blue;">⏳ Menghapus file...</td></tr>';
          
          google.script.run
            .withSuccessHandler(function(response) {
              alert(response); // Tampilkan pesan sukses/gagal
              muatData(); // Muat ulang data agar tabel terupdate
            })
            .withFailureHandler(function(error) {
              alert("Error: " + error);
              muatData();
            })
            .hapusFileDanCatat(namaFile, folder);
        }
      }
    </script>
  </body>
</html>
